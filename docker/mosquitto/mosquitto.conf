# Geliştirme yapılandırması: kimlik doğrulaması kapalı, yerel ağda çalışır.
# Üretimde: allow_anonymous false + password_file + cihaz başına ACL (Bölüm 12.1).
listener 1883
allow_anonymous true

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
