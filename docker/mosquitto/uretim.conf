# Mosquitto — üretim/demo yapılandırması (kimlik doğrulamalı)
#
# Geliştirmede docker/mosquitto/mosquitto.conf (anonim erişim) kullanılır.
# Bu dosya, planlama dokümanı Bölüm 12.1'deki "cihaz başına kimlik + ACL" kuralını uygular:
#   · her ESP32 kendi kullanıcı adı/parolasıyla bağlanır,
#   · yalnızca kendi kutusunun topic'lerine yazabilir,
#   · sunucu (api kullanıcısı) tüm depo ağacını okuyup yazabilir.
#
# Kullanım:
#   bash tools/mqtt-kimlik-olustur.sh 5           # 5 kutu için parola + ACL üretir
#   docker compose --profile guvenli up -d mosquitto-guvenli

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/parolalar
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Cihaz koptuğunda LWT'nin hızlı yayılması için makul bir üst sınır
max_keepalive 60
