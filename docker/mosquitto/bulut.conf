# Mosquitto — bulut (Railway) yapılandırması.
#
# Broker yalnızca Railway'in özel ağına açıktır: API ve kutu simülatörü aynı
# proje içinden `mosquitto.railway.internal` ile bağlanır. Dışarıya TCP proxy
# açılmadığı sürece internetten erişilemez, bu yüzden anonim bağlantı yeterlidir.
#
# Gerçek ESP32'leri doğrudan buraya bağlamak isterseniz: Railway'de 1883 için
# TCP proxy açın ve bu dosya yerine uretim.conf'u (kimlik doğrulamalı) kullanın —
# aksi halde broker internete anonim açılmış olur.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
