; Pick-to-Light — kutu kontrolcüsü (ESP32)
; Yükleme:  pio run -t upload -e kutu    ·  Seri izleme: pio device monitor
;
; Her kutuya aynı firmware yüklenir; kutu kimliği ilk açılışta seri porttan
; veya KUTU_ID derleme bayrağıyla verilir ve NVS'e kalıcı yazılır.

[env:kutu]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit NeoPixel@^1.12.3
    bertmelis/espMqttClient@^1.7.0
    ; Baskül (HX711) için aşağıdaki [env:kutu-baskul] ortamını kullanın.

build_flags =
    -DWIFI_SSID='"DEPO_WIFI"'
    -DWIFI_PAROLA='"wifi-parolasi"'
    -DMQTT_SUNUCU='"192.168.1.10"'
    -DMQTT_PORT=1883
    ; Broker'da kimlik doğrulama açıksa (bkz. tools/mqtt-kimlik-olustur.sh):
    ; -DMQTT_KULLANICI='"kutu1"'
    ; -DMQTT_PAROLA='"uretilen-parola"'
    ; Kutu kimliği (0 ise NVS'teki değer kullanılır, seri porttan atanabilir)
    -DKUTU_ID=0
    ; LED tipi: 1 = WS2812B (tek pin, önerilen) · 0 = ayrı yeşil/sarı/kırmızı LED
    -DWS2812B_KULLAN=1
    ; Ağırlık sensörü (HX711) bağlıysa 1 yapın
    -DAGIRLIK_SENSORU=0

; Kutunun altında HX711 baskül olan cihaz: ağırlıktan adet sayar, otomatik teyit eder.
;   pio run -t upload -e kutu-baskul
[env:kutu-baskul]
extends = env:kutu
lib_deps =
    ${env:kutu.lib_deps}
    bogde/HX711@^0.7.5
build_flags =
    ${env:kutu.build_flags}
    -UAGIRLIK_SENSORU
    -DAGIRLIK_SENSORU=1

[env:kutu-ayri-led]
extends = env:kutu
build_flags =
    ${env:kutu.build_flags}
    -UWS2812B_KULLAN
    -DWS2812B_KULLAN=0
